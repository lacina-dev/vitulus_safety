# lidar_objects — detekce větších pohyblivých objektů (kočka / pes / člověk)
# Všechny hodnoty jdou přepsat i za běhu přes rosparam + restart uzlu.

scan_topic: /scan
odom_topic: /mobile_base_controller/odom
target_frame: base_link
publish_rate: 5.0             # Hz na /safety/lidar_objects
publish_markers: true

# Statické pozadí (klouzavý medián vzdálenosti per paprsek)
bg_window_s: 60.0             # co v obraze vydrží déle, stane se pozadím
bg_sample_dt: 0.5             # jak často se scan ukládá do okna
bg_min_samples: 10            # dokud jich není tolik, nedetekuje se nic

# Popředí = paprsek výrazně blíž než pozadí
fg_margin_m: 0.20             # absolutní mez
fg_margin_frac: 0.06          # relativní mez (bere se max z obou)
fg_max_range_m: 10.0
fg_min_range_m: 0.15

# Shlukování popředí
cluster_gap_m: 0.18
cluster_gap_k: 3.0            # práh mezery roste s dosahem (r × Δθ)

# Filtr kandidátů
min_size_m: 0.15              # kočka
max_size_m: 1.20              # člověk / velký pes; větší = zeď, auto
min_points_floor: 3           # 2 paprsky = hrana, ne zvíře
min_points_near: 4
near_range_m: 3.0

# Sledování mezi scany
assoc_dist_m: 0.60
confirm_frames: 3             # souvislá série zásahů (~0,3 s při 10 Hz); výpadek ji nuluje
far_range_m: 3.5
far_confirm_frames: 6         # dál než far_range_m je potřeba delší série
appear_min_s: 1.0             # ohlásí se (a publikuje) až po tolika sekundách sledování
event_max_range_m: 8.0
max_missed: 10                # ~1 s výpadku stopa přežije
speed_alpha: 0.4
max_speed_mps: 4.0

# Mihotání ≠ objekt (5. 9.) — čtyři nezávislé důkazy, viz komentář v uzlu
flicker_flips: 3              # paprsek, který v okně pozadí ≥ tolikrát přeskočil blíž a zpět
flicker_alt_tol_m: 0.25       # návrat v této toleranci od bližšího módu = známý povrch
flicker_neigh_beams: 4        # kolik sousedů se hledá pro „bližší mód sedí na hraně"
solid_ratio_min: 0.5          # podíl nemihotavých paprsků nutný pro novou stopu
edge_tol_m: 0.30              # malý shluk v dosahu pozadí sousedů = odštěpek stěny
edge_max_points: 6
straightness_min: 0.35        # pohybující se stopa musí jít někam

# Hrubá klasifikace podle šířky (a rychlosti)
cls_small_max_m: 0.30         # < small (kočka)
cls_medium_max_m: 0.60        # < medium (pes), výš large (člověk)

# Za jízdy robota je statické pozadí neplatné — nad tuhle rychlost se resetuje
motion_speed_mps: 0.05
